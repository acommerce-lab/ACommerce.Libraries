name: iOS Release (TestFlight)

# NOTE: iOS CI is the hardest to get green on the first run because it depends
# on the runner's Xcode version matching the .NET 8 iOS workload, plus Apple
# code-signing material. Treat the first run as a validation pass and expect to
# tweak the Xcode version / workload. Android + backend are the reliable ones.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number / CFBundleVersion — MUST be higher than last on App Store Connect (baseline 233)"
        required: true
        type: string
      version_name:
        description: "Marketing version (blank = 1.<build_number>)"
        required: false
        type: string

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          else
            echo "::warning::Xcode_26.3 not found; using $(xcode-select -p). The .NET 8 iOS workload pins to a specific Xcode — adjust this step to an installed version."
          fi
          xcodebuild -version

      - name: Pin .NET 8 SDK
        run: cp global.net8.json global.json

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install iOS workload
        run: dotnet workload install maui-ios

      # bitcode_strip is broken on Xcode 26+. The csproj already neutralizes it,
      # but patch the Firebase targets too as belt-and-suspenders (mirrors build-ios.sh).
      - name: Patch Firebase bitcode_strip
        run: |
          T="$HOME/.nuget/packages/xamarin.firebase.ios.core/8.10.0.3/buildTransitive/Xamarin.Firebase.iOS.Core.targets"
          if [ -f "$T" ] && ! grep -q "Skipped bitcode_strip" "$T"; then
            sed -i.bak 's|<Exec Command="$(_BitcodeStripCommand) %|<Exec Command="echo Skipped bitcode_strip on %|g' "$T"
            echo "Patched $T"
          fi

      - name: Import signing certificate
        env:
          CERT_P12_B64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          CERT_PASS: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KPASS="ci-$(openssl rand -hex 12)"
          security create-keychain -p "$KPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPASS" "$KEYCHAIN"
          echo "$CERT_P12_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"

      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/ashare.mobileprovision"

      - name: Compute version name
        run: |
          VN="${{ inputs.version_name }}"
          [ -z "$VN" ] && VN="1.${{ inputs.build_number }}"
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"

      - name: Build & archive IPA
        run: |
          export PATH="$(dirname $(xcrun --find strip)):$PATH"
          dotnet publish Apps/Ashare.App/Ashare.App.csproj \
            -c Release -f net8.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:ApplicationVersion=${{ inputs.build_number }} \
            -p:ApplicationDisplayVersion="$VERSION_NAME"

      - name: Locate IPA
        run: |
          IPA=$(find Apps/Ashare.App/bin/Release -name "*.ipa" | head -n1)
          [ -z "$IPA" ] && { echo "No IPA produced"; exit 1; }
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
          echo "Found: $IPA"

      - uses: actions/upload-artifact@v4
        with:
          name: ashare-ios-ipa
          path: ${{ env.IPA_PATH }}

      - name: Upload to App Store Connect (TestFlight)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_B64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
