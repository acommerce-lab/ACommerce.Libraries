name: Android Release

# Manual, controlled releases ("managed publishing"). You pick the version code
# and the Play track each run. Nothing ships automatically on push.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode — MUST be higher than the last value on Play (baseline 233)"
        required: true
        type: string
      version_name:
        description: "Version name shown to users (blank = 1.<version_code>)"
        required: false
        type: string
      track:
        description: "Google Play track"
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      release_status:
        description: "Release status on the track"
        required: true
        default: completed
        type: choice
        options: [completed, draft]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin .NET 9 for the Android TFM (global.json is gitignored, so copy the template).
      - name: Pin .NET 9 SDK
        run: cp global.net9.json global.json

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # Firebase config is not committed for Android — restore it from a secret.
      - name: Write google-services.json
        env:
          GS_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GS_JSON_B64" ]; then
            echo "::warning::ANDROID_GOOGLE_SERVICES_JSON_BASE64 not set — building WITHOUT Firebase (push notifications will not work)."
          else
            echo "$GS_JSON_B64" | base64 -d > Apps/Ashare.App/Platforms/Android/google-services.json
            echo "Wrote google-services.json ($(wc -c < Apps/Ashare.App/Platforms/Android/google-services.json) bytes)"
          fi

      # Upload keystore lives in a secret as base64; decode to a temp file.
      - name: Write upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ashare-upload.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ashare-upload.keystore" >> "$GITHUB_ENV"

      - name: Compute version name
        run: |
          VN="${{ inputs.version_name }}"
          [ -z "$VN" ] && VN="1.${{ inputs.version_code }}"
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore Apps/Ashare.App/Ashare.App.csproj -p:MobilePlatform=android

      - name: Publish signed AAB
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dotnet publish Apps/Ashare.App/Ashare.App.csproj \
            --no-restore \
            -c Release \
            -f net9.0-android \
            -p:MobilePlatform=android \
            -p:AndroidPackageFormat=aab \
            -p:ApplicationVersion=${{ inputs.version_code }} \
            -p:ApplicationDisplayVersion="$VERSION_NAME" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$KEYSTORE_PATH" \
            -p:AndroidSigningKeyAlias="$KEY_ALIAS" \
            -p:AndroidSigningStorePass="$STORE_PASS" \
            -p:AndroidSigningKeyPass="$KEY_PASS"

      - name: Locate AAB
        run: |
          AAB=$(find Apps/Ashare.App/bin/Release -name "*-Signed.aab" | head -n1)
          [ -z "$AAB" ] && AAB=$(find Apps/Ashare.App/bin/Release -name "*.aab" | head -n1)
          [ -z "$AAB" ] && { echo "No AAB produced"; exit 1; }
          echo "AAB_PATH=$AAB" >> "$GITHUB_ENV"
          echo "Found: $AAB"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashare-android-aab
          path: ${{ env.AAB_PATH }}

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ashare.ashare
          releaseFiles: ${{ env.AAB_PATH }}
          track: ${{ inputs.track }}
          status: ${{ inputs.release_status }}
